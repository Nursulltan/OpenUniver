<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KazNU — выбор дизайна</title>
<style>
  :root { --acc: #2f6fed; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef0f4; color: #15171c; }
  body.dark { background: #0f1115; color: #eef0f4; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 14px 22px; background: color-mix(in srgb, currentColor 4%, Canvas); border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  body.dark header { background: #161921; }
  h1 { font-size: 20px; margin: 0 12px 0 0; }
  label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
  .sw { display: inline-flex; gap: 6px; }
  .sw button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .sw button.on { border-color: currentColor; }
  select, input[type=color] { font: inherit; }
  .hint { width: 100%; margin: 0; font-size: 13px; opacity: .7; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px; padding: 24px 22px 60px; }
  .it { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .frame { width: 300px; height: 620px; border-radius: 34px; padding: 8px; background: #111; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
  .frame iframe { width: 100%; height: 100%; border: 0; border-radius: 27px; background: #fff; }
  .it h2 { margin: 0; font-size: 16px; }
  .it p { margin: -6px 0 0; font-size: 13px; opacity: .7; text-align: center; max-width: 290px; }
  .it button.pick { border: 0; border-radius: 99px; padding: 9px 22px; font: inherit; font-weight: 600; background: var(--acc); color: #fff; cursor: pointer; }
  .it.cur .frame { box-shadow: 0 0 0 4px var(--acc), 0 14px 40px rgba(0,0,0,.25); }
</style>
</head>
<body>
<header>
  <h1>Выбор дизайна</h1>
  <label>Тема
    <select id="dark"><option value="0">Светлая</option><option value="1">Тёмная</option></select>
  </label>
  <label>Цвет <span class="sw" id="sw"></span> <input type="color" id="acc" value="#2f6fed"></label>
  <label>Экран
    <select id="route">
      <option value="">Главная</option><option value="schedule">Расписание</option><option value="grades">Оценки</option>
      <option value="more">Ещё</option><option value="design">Настройки дизайна</option>
    </select>
  </label>
  <p class="hint">Каждый телефон — живое приложение: в нём можно листать и нажимать. «Выбрать» сохраняет стиль и открывает приложение — там в «Ещё → Дизайн» настраивается всё остальное (фон, своё фото, иконки, меню, карточки, шрифт, цвет по кругу).</p>
</header>
<main id="grid"></main>
<script>
const STYLES = [
  ['classic', 'Классика', 'Привычный вид приложения, чистые карточки'],
  ['material', 'Material You', 'Стоковый Android: тональные цвета, капсула под иконкой'],
  ['glass', 'Жидкое стекло', 'Как у Apple: полупрозрачное размытое стекло над ярким фоном'],
  ['ios', 'iOS', 'Сгруппированные списки и крупные заголовки, как в iPhone'],
  ['neumorph', 'Неоморфизм', 'Мягкий объём: карточки выдавлены из фона'],
  ['minimal', 'Минимализм', 'Тонкие линии, ничего лишнего'],
  ['amoled', 'AMOLED', 'Чистый чёрный, бережёт батарею'],
  ['paper', 'Бумага', 'Тёплый фон и заголовки с засечками'],
  ['neon', 'Неон', 'Тёмный фон и светящиеся рамки'],
  ['brutal', 'Брутализм', 'Жирные рамки и сдвинутые тени'],
  ['candy', 'Конфетный', 'Пастель, большие скругления, цветные плитки'],
];
const COLORS = ['#2f6fed', '#7c4dff', '#e91e63', '#f2994a', '#16a34a', '#0ea5a4', '#111827'];
const $ = s => document.querySelector(s);
const saved = (() => { try { return JSON.parse(localStorage.getItem('settings') || '{}'); } catch { return {}; } })();
let acc = saved.accent || COLORS[0], cur = saved.design?.preset || 'classic';
$('#acc').value = acc;
$('#sw').innerHTML = COLORS.map(c => `<button style="background:${c}" data-c="${c}" title="${c}"></button>`).join('');
function url(p) {
  const q = new URLSearchParams({ preset: p, acc });
  q.set('dark', $('#dark').value);
  const r = $('#route').value;
  return '/?' + q + (r ? '#' + r : '');
}
function draw() {
  document.documentElement.style.setProperty('--acc', acc);
  document.body.classList.toggle('dark', $('#dark').value === '1');
  [...$('#sw').children].forEach(b => b.classList.toggle('on', b.dataset.c === acc));
  $('#grid').innerHTML = STYLES.map(([k, n, d]) => `<div class="it${k === cur ? ' cur' : ''}">
    <div class="frame"><iframe loading="lazy" src="${url(k)}" title="${n}"></iframe></div>
    <h2>${n}</h2><p>${d}</p><button class="pick" data-k="${k}">${k === cur ? 'Выбран — открыть' : 'Выбрать'}</button></div>`).join('');
}
$('#sw').onclick = e => { const c = e.target.dataset.c; if (c) { acc = c; $('#acc').value = c; draw(); } };
$('#acc').onchange = e => { acc = e.target.value; draw(); };
$('#dark').onchange = $('#route').onchange = draw;
$('#grid').onclick = e => {
  const k = e.target.dataset.k; if (!k) return;
  const s = (() => { try { return JSON.parse(localStorage.getItem('settings') || '{}'); } catch { return {}; } })();
  s.design = { ...(s.design || {}), preset: k }; s.accent = acc;
  s.theme = $('#dark').value === '1' ? 'dark' : 'light';
  localStorage.setItem('settings', JSON.stringify(s));
  location.href = '/';
};
draw();
</script>
</body>
</html>
